name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    name: Lint
    steps:
      - uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Npm install
        run: npm ci

      - name: Composer install
        run: composer install

      - name: Running lint check
        run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    name: Unit Test
    steps:
      - uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Npm install
        run: npm ci

      - name: Running unit tests
        run: npm run test:unit

  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - php: '8.2'
            wp: WordPress
            label: WP trunk
          - php: '8.2'
            wp: WordPress#7.1
            label: WP 7.1

          - php: '8.4'
            wp: WordPress
            label: WP trunk
          - php: '8.4'
            wp: WordPress#7.1
            label: WP 7.1

          - php: '8.5'
            wp: WordPress
            label: WP trunk
          - php: '8.5'
            wp: WordPress#7.1
            label: WP 7.1

    name: E2E / PHP ${{ matrix.php }} / ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Npm install and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright dependencies
        run: npx playwright install chromium --with-deps

      - name: Install WordPress
        run: |
          WP_ENV_CORE=WordPress/${{ matrix.wp }} WP_ENV_PHP_VERSION=${{ matrix.php }} npm run wp-env-test start
          npm run wp-env-test run cli wp core version
          npm run wp-env-test run cli wp cli info

      - name: Running e2e tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Archive debug artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failures-artifacts-${{ matrix.php }}-${{ matrix.wp }}
          path: artifacts
          if-no-files-found: ignore
