name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    name: Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Npm install
        run: npm ci

      - name: Composer install
        run: composer install

      - name: Running lint check
        run: npm run lint

  js-unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    name: JavaScript Unit Test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Npm install
        run: npm ci

      - name: Running JavaScript unit tests
        run: npm run test:unit

  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # Browser differences only depend on the WordPress version,
          # so all browsers run on the latest PHP only.
          - php: '8.2'
            wp: WordPress
            label: WP trunk
            browsers: chromium
          - php: '8.2'
            wp: WordPress#7.1.3
            label: WP 7.1.3
            browsers: chromium

          - php: '8.4'
            wp: WordPress
            label: WP trunk
            browsers: chromium
          - php: '8.4'
            wp: WordPress#7.1.3
            label: WP 7.1.3
            browsers: chromium

          - php: '8.5'
            wp: WordPress
            label: WP trunk
            browsers: chromium firefox webkit
          - php: '8.5'
            wp: WordPress#7.1.3
            label: WP 7.1.3
            browsers: chromium firefox webkit

    name: E2E / PHP ${{ matrix.php }} / ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Npm install and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright dependencies
        run: npx playwright install ${{ matrix.browsers }} --with-deps

      - name: Install WordPress
        run: |
          WP_ENV_CORE=WordPress/${{ matrix.wp }} WP_ENV_PHP_VERSION=${{ matrix.php }} npm run wp-env-test start
          npm run wp-env-test run cli wp core version
          npm run wp-env-test run cli wp cli info

      - name: Running e2e tests
        run: npm run test:e2e -- $(printf -- '--project=%s ' ${{ matrix.browsers }})
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Archive debug artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failures-artifacts-${{ matrix.php }}-${{ matrix.wp }}
          path: artifacts
          if-no-files-found: ignore

  # Temporary job to investigate why the keyboard test fails in WebKit on Ubuntu 26.04.
  e2e-webkit-debug:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]

    name: E2E WebKit debug / ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Npm install and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright dependencies
        run: npx playwright install webkit --with-deps

      - name: Print environment information
        run: |
          cat /etc/os-release
          uname -a
          ls ~/.cache/ms-playwright
          dpkg-query -W -f='${Package} ${Version}\n' \
            'libgtk-4-1' 'libglib2.0-0*' 'libwpe-1*' 'libwpebackend-fdo*' 'libsoup-3.0-0' \
            'libicu*' 'libharfbuzz0b' 'libgstreamer1.0-0' 'libmanette-0.2-0' 'libenchant-2-2' \
            'libxkbcommon0' 'libwayland-client0' 'libepoxy0' 2>/dev/null || true
          echo '--- Missing shared libraries of the WebKit build ---'
          find ~/.cache/ms-playwright/webkit-* -type f -name '*.so*' -exec ldd {} \; 2>/dev/null | grep 'not found' | sort -u || true

      - name: Install WordPress
        run: WP_ENV_CORE=WordPress/WordPress WP_ENV_PHP_VERSION=8.5 npm run wp-env-test start

      - name: Running e2e tests
        run: npm run test:e2e -- --project=webkit --retries=0 --trace=on test/e2e/editor.spec.ts test/e2e/debug-webkit-focus.spec.ts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          DEBUG_WEBKIT_FOCUS: 1
          DEBUG: pw:browser

      - name: Archive debug artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webkit-debug-artifacts-${{ matrix.os }}
          path: artifacts
          if-no-files-found: ignore
